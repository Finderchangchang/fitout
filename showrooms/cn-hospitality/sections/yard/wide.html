<section class="section yard" data-section="yard" data-family="panorama" data-fullbleed id="{{anchor}}">
  <figure class="yard-frame">
    <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
    <figcaption class="container yard-copy">
      {{#if caption}}<p>{{caption}}</p>{{/if}}
      {{#if href}}{{#if linkLabel}}<a class="btn" href="{{href}}">{{linkLabel}}</a>{{/if}}{{/if}}
    </figcaption>
  </figure>
</section>
