<section class="section" data-section="stays" data-family="lodging" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="stay-grid" data-media-group="card">
      {{#each items}}
      <article class="card stay-card">
        <a href="{{href}}"><img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async"></a>
        <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
        <p class="media-card-summary">{{area}} · {{bed}} · {{guests}}</p>
        <p class="price media-card-meta">{{price}}</p>
        <div class="btn-row">
          <a class="btn btn-primary" href="tel:{{phoneTel}}">电话预订</a>
          <a class="text-link" href="{{href}}">看这间房</a>
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
