<section class="section" data-section="supper" data-family="menu-list" id="{{anchor}}"><div class="container"><div class="section-head">{{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}{{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}{{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}</div><div class="plain-supper-menu">{{#each items}}<article><h3 class="item-title">{{name}}</h3><p class="plain-price">{{price}}</p></article>{{/each}}</div>{{#if href}}{{#if linkLabel}}<p><a class="btn" href="{{href}}">{{linkLabel}}</a></p>{{/if}}{{/if}}</div></section>
