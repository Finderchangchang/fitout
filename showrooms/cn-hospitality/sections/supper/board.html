<section class="section" data-section="supper" data-family="supper" id="{{anchor}}">
  <div class="container supper-top">
    <div class="supper-copy">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      {{#if body}}<p class="prose">{{body}}</p>{{/if}}
      {{#if href}}{{#if linkLabel}}<p><a class="btn" href="{{href}}">{{linkLabel}}</a></p>{{/if}}{{/if}}
    </div>
    <figure class="hall-photo" data-media-group="hall">
      <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
      {{#if caption}}<figcaption>{{caption}}</figcaption>{{/if}}
    </figure>
  </div>
  <div class="container dish-row" data-media-group="dish">
    {{#each items}}
    <article class="dish">
      <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
      <h3 class="item-title">{{name}}</h3>
      <p class="price">{{price}}</p>
    </article>
    {{/each}}
  </div>
</section>
