<section class="section" data-section="nearby" data-family="nearby" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="near-grid" data-media-group="card">
      {{#each items}}
      <article class="card near-card">
        <a href="{{href}}"><img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async"></a>
        <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
        <p class="media-card-summary">{{text}}</p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
