<section class="section" data-section="services" data-family="domains" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="domain-grid" data-media-group="card">
      {{#each items}}
      <article class="domain">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3 class="item-title">{{#if href}}<a href="{{href}}">{{name}}</a>{{else}}{{name}}{{/if}}</h3>
        <p class="media-card-summary">{{text}}</p>
        {{#if tag}}<p class="media-card-meta"><span class="media-card-tag">{{tag}}</span></p>{{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
