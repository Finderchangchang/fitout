<section class="section" data-section="contact" data-family="visit" id="{{anchor}}">
  <div class="container contact-desk">
    <div class="contact-intro">
      <div class="section-head">
        {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
        {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
        {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      </div>
      <div class="contact-hours">
        <p class="kicker">{{ui.hours}}</p>
        {{#each hours}}
        <p class="hour-row">{{day}} <span class="nums">{{time}}</span></p>
        {{/each}}
      </div>
    </div>
    <div class="visit-triad">
      <a href="tel:{{phoneTel}}"><span>电话</span>{{phone}}</a>
      {{#if email}}<a href="mailto:{{email}}"><span>邮件</span>{{email}}</a>{{/if}}
      <a href="{{amapUrl}}"><span>地址</span>{{address}}</a>
    </div>
  </div>
</section>
