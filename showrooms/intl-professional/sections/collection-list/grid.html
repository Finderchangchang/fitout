<section class="section" data-section="collection-list" data-family="catalog" id="{{anchor}}">
  <div class="container catalog-block">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    {{#if filters}}
    <nav class="filter-row" aria-label="分类">
      <a href="#{{anchor}}">全部</a>
      {{#each filters}}<a href="#{{anchor}}-{{key}}">{{label}}</a>{{/each}}
    </nav>
    {{#each filters}}<span id="{{anchor}}-{{key}}" class="filter-hook"></span>{{/each}}
    <style>
      .catalog-block:not(:has(.filter-hook:target)) .filter-row a[href="#{{anchor}}"] {
        color: var(--accent);
      }
      {{#each filters}}
      .catalog-block:has(#{{anchor}}-{{key}}:target) .filter-row a[href$="#{{anchor}}-{{key}}"] {
        color: var(--accent);
      }
      .catalog-block:has(#{{anchor}}-{{key}}:target) .catalog-card { display: none; }
      .catalog-block:has(#{{anchor}}-{{key}}:target) .catalog-card[data-cat="{{key}}"] { display: block; }
      {{/each}}
    </style>
    {{/if}}
    <div class="catalog-grid fit-rows">
      {{#each items}}
      <article class="catalog-card" data-cat="{{catKey}}">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
        {{#if summary}}<p>{{summary}}</p>{{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
