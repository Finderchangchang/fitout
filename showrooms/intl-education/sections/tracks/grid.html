<section class="section" data-section="tracks" data-family="lanes" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if label}}<p class="kicker">{{label}}</p>{{/if}}
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="track-grid" data-media-group="card">
      {{#each items}}
      <article class="track-card">
        <a href="{{href}}">
          <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
          <h3 class="item-title">{{name}}</h3>
          <p>{{text}}</p>
        </a>
      </article>
      {{/each}}
    </div>
  </div>
</section>
