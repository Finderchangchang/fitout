<section class="section plain-section" data-section="lots" data-family="text-catalog" id="{{anchor}}"><div class="container"><div class="section-head">{{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}{{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}{{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}</div><div class="plain-list">{{#each items}}<article class="plain-item"><h3 class="item-title">{{#if href}}<a href="{{href}}">{{name}}</a>{{else}}{{name}}{{/if}}</h3>{{#if summary}}<p>{{summary}}</p>{{/if}}</article>{{/each}}</div></div></section>
