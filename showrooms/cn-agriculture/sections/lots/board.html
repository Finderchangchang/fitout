<section class="section" data-section="lots" data-family="ledger" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      <span class="grain-kicker" aria-hidden="true"></span>
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="lot-list" data-media-group="lot">
      {{#each items}}
      <article class="lot-row">
        <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
        <div>
          <h3>{{name}}</h3>
          <p>{{summary}}</p>
          <p><a class="text-link" href="{{href}}">看这款</a></p>
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
