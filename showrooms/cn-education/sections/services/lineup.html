<section class="section course-lineup" data-section="services" data-family="lineup" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="lineup-grid" data-media-group="portrait">
      {{#each items}}
      <article>
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3 class="item-title">{{#if href}}<a href="{{href}}">{{name}}</a>{{else}}{{name}}{{/if}}</h3>
        <p>{{text}}</p>
        {{#if price}}<p class="price">{{price}}</p>{{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
