<section class="section" data-section="campus" data-family="story" id="{{anchor}}">
  <div class="container campus-grid">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      <p><a href="{{href}}">{{linkLabel}}</a></p>
    </div>
    <div data-media-group="card">
      <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
      <div class="thumb-row">
        {{#each thumbs}}
        <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
        {{/each}}
      </div>
    </div>
  </div>
</section>
