<section class="section" data-section="advantage" data-family="points" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="advantage-points">
      {{#each items}}
      <article>
        <h3 class="item-title">{{name}}</h3>
        <p>{{text}}</p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
