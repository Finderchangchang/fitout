<section class="section" data-section="course-board" data-family="lanes" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <style>
      {{#each groups}}
      #{{anchor}} .lane-box:has(#lane-{{anchor}}-{{@index}}:checked) > .lane-panel:nth-of-type({{@index}}) {
        display: block;
      }
      #{{anchor}} .lane-box:has(#lane-{{anchor}}-{{@index}}:checked) > label:nth-of-type({{@index}}) {
        border-bottom-color: var(--primary);
      }
      #{{anchor}} .lane-box:has(#lane-{{anchor}}-{{@index}}:checked) > label:nth-of-type({{@index}})::before {
        background: var(--accent);
      }
      {{/each}}
    </style>
    <div class="lane-box">
      {{#each groups}}
      <input type="radio" name="lanes-{{anchor}}" id="lane-{{anchor}}-{{@index}}">
      {{/each}}
      {{#each groups}}
      <label for="lane-{{anchor}}-{{@index}}">{{name}}</label>
      {{/each}}
      {{#each groups}}
      <div class="lane-panel">
        <div class="lane-cards" data-media-group="portrait">
          {{#each items}}
          <article>
            <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
            <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
            <p class="media-card-summary">{{text}}</p>
            <p class="media-card-meta"><span class="media-card-tag">{{hours}}</span><span class="media-card-tag">{{price}}</span></p>
          </article>
          {{/each}}
        </div>
      </div>
      {{/each}}
    </div>
  </div>
</section>
