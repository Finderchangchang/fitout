<section class="section stat-band" data-section="trust" data-family="metrics" data-band="sat" id="{{anchor}}">
  <div class="container">
    <div class="section-head cm-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      <span class="cm-rule" aria-hidden="true"></span>
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <dl class="stat-grid">
      {{#each items}}
      <div>
        <dt>{{label}}</dt>
        <dd class="stat-value" data-count="{{countTo}}">{{value}}</dd>
      </div>
      {{/each}}
    </dl>
  </div>
</section>
