<section class="section" data-section="trust" data-family="credentials" id="{{anchor}}">
  <div class="container">
    <div class="section-head cm-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      <span class="cm-rule" aria-hidden="true"></span>
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="cert-grid" data-media-group="seal">
      {{#each items}}
      <article class="cert-card">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3 class="item-title">{{name}}</h3>
        {{#if issuer}}<p class="meta">{{issuer}}</p>{{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
