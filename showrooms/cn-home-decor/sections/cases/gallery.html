<section class="section" data-section="cases" data-family="gallery" id="{{anchor}}">
  <div class="container">
    <div class="section-head cm-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      <span class="cm-rule" aria-hidden="true"></span>
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="gallery-grid" data-media-group="card">
      {{#each items}}
      <figure class="card">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <figcaption>
          <h3 class="item-title">{{#if href}}<a href="{{href}}">{{name}}</a>{{else}}{{name}}{{/if}}</h3>
          <p>{{text}}</p>
          {{#if result}}<p class="case-result">{{result}}</p>{{/if}}
        </figcaption>
      </figure>
      {{/each}}
    </div>
  </div>
</section>
