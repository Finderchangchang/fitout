<section class="section" data-section="lanes" data-family="index" id="{{anchor}}">
  <div class="container">
    <div class="section-head cm-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      <span class="cm-rule" aria-hidden="true"></span>
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="lane-grid">
      {{#each items}}
      <a class="lane" href="{{href}}">
        <span class="lane-no">{{@index}}</span>
        <span class="lane-copy">
          <span class="item-title">{{name}}</span>
          <span class="lane-text">{{text}}</span>
        </span>
      </a>
      {{/each}}
    </div>
  </div>
</section>
