<section class="section" data-section="offer" data-family="tariff" id="{{anchor}}">
  <div class="container">
    <div class="section-head cm-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      <span class="cm-rule" aria-hidden="true"></span>
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="offer-grid" data-media-group="card">
      {{#each items}}
      <article class="card offer-card">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
        <p class="offer-price media-card-meta">{{price}}</p>
        <p class="media-card-summary">{{text}}</p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
