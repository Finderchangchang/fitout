<section class="section" data-section="collection-list" data-family="digest" id="{{anchor}}">
  <div class="container">
    <div class="section-head cm-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      <span class="cm-rule" aria-hidden="true"></span>
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      {{#if moreHref}}{{#if moreLabel}}<p><a class="text-link" href="{{moreHref}}">{{moreLabel}}</a></p>{{/if}}{{/if}}
    </div>
    <div class="digest-list" data-media-group="card">
      {{#each items}}
      <article class="digest-item">
        {{#if image}}<a class="digest-photo" href="{{href}}"><img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async"></a>{{/if}}
        <div>
          <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
          {{#if summary}}<p>{{summary}}</p>{{/if}}
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
