<section class="section" data-section="faq" data-family="accordion" id="{{anchor}}">
  <div class="container">
    <div class="section-head cm-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      <span class="cm-rule" aria-hidden="true"></span>
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="faq-list">
      {{#each items}}
      <details>
        <summary>{{q}}<span class="chev">{{icon:chevron-down:20}}</span></summary>
        <p class="prose">{{a}}</p>
      </details>
      {{/each}}
    </div>
  </div>
</section>
