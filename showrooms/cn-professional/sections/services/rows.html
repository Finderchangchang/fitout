<section class="section" data-section="services" data-family="practice" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="practice-list" data-media-group="card">
      {{#each items}}
      <article class="practice-row">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <div>
          {{#if href}}<h3 class="item-name"><a href="{{href}}">{{name}}</a></h3>{{else}}<h3 class="item-name">{{name}}</h3>{{/if}}
          <p class="media-card-summary">{{text}}</p>
          <p class="media-card-meta">{{#if tag}}<span class="media-card-tag">{{tag}}</span>{{/if}}{{#if price}}<span class="price">{{price}}</span>{{/if}}</p>
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
