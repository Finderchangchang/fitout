<section class="section" data-section="why" data-family="dossier" id="{{anchor}}">
  <div class="container dossier">
    <div class="dossier-copy">
      <div class="section-head">
        {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
        {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
        {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      </div>
      {{#if body}}<p class="prose">{{body}}</p>{{/if}}
      <ul class="dossier-points">
        {{#each items}}
        <li>
          <h3 class="item-name">{{name}}</h3>
          <p>{{text}}</p>
        </li>
        {{/each}}
      </ul>
    </div>
    {{#if image}}<img class="dossier-photo" src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
  </div>
</section>
