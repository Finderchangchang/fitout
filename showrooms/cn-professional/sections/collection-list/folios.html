<section class="section" data-section="collection-list" data-family="folios" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="folio-list" data-media-group="card">
      {{#each items}}
      <article class="folio-row">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <div>
          <h3 class="item-name"><a href="{{href}}">{{name}}</a></h3>
          {{#if summary}}<p>{{summary}}</p>{{/if}}
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
