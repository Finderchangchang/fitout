<section class="section" data-section="honors" data-family="ribbons" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <ul class="shelf">
      {{#each items}}
      <li class="honor">
        <p class="rail-year">{{year}}</p>
        <h3 class="item-name">{{name}}</h3>
        {{#if issuer}}<p>{{issuer}}</p>{{/if}}
      </li>
      {{/each}}
    </ul>
  </div>
</section>
