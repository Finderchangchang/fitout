<section class="section" data-section="services" data-family="catalog" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="svc-grid" data-media-group="card">
      {{#each items}}
      <article class="svc-card">
        <a href="{{href}}">
          <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
          <h3 class="item-title">{{name}}</h3>
        </a>
        <p>{{text}}</p>
        {{#if price}}<p class="price">{{price}}</p>{{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
