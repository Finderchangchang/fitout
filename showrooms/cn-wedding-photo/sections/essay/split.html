<section class="section" data-section="essay" data-family="essay" id="{{anchor}}">
  <div class="container essay-grid">
    <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
    <div>
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      <p class="prose">{{body}}</p>
      {{#if href}}{{#if hrefLabel}}<p class="essay-more"><a class="btn" href="{{href}}">{{hrefLabel}}</a></p>{{/if}}{{/if}}
    </div>
  </div>
</section>
