<section class="section" data-section="collection-detail" data-family="portrait" id="{{anchor}}">
  <div class="container person">
    {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
    <div class="detail-copy">
      {{#if isH1}}<h1 class="section-title">{{name}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{name}}</h2>{{/if}}
      <p class="section-lead">{{summary}}</p>
      {{#if body}}<p class="prose">{{body}}</p>{{/if}}
      {{#if specs}}
      <table class="spec-table">
        <tbody>
          {{#each specs}}
          <tr>
            <th>{{label}}</th>
            <td>{{value}}</td>
          </tr>
          {{/each}}
        </tbody>
      </table>
      {{/if}}
      <div class="btn-row">
        <a class="btn btn-primary" href="{{primaryHref}}">{{primaryLabel}}</a>
        {{#if backHref}}<a class="btn" href="{{backHref}}">{{backLabel}}</a>{{/if}}
      </div>
    </div>
  </div>
</section>
