<section class="section" data-section="collection-list" data-family="sheet" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="sheet-list" data-media-group="card">
      {{#each items}}
      <article class="sheet-row">
        {{#if image}}<a href="{{href}}"><img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async"></a>{{/if}}
        <div>
          <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
          {{#if summary}}<p>{{summary}}</p>{{/if}}
          <p><a class="btn" href="{{href}}">看这档</a></p>
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
