<section class="section" data-section="bulletin" data-family="bulletin" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="bulletin-list" data-media-group="card">
      {{#each items}}
      <article class="bulletin-row">
        <a href="{{href}}"><img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async"></a>
        <div>
          <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
          <p class="media-card-summary">{{text}}</p>
          {{#if date}}<p class="media-card-meta"><time datetime="{{date}}">{{date}}</time></p>{{/if}}
        </div>
      </article>
      {{/each}}
    </div>
    {{#if href}}{{#if hrefLabel}}<p class="bulletin-more"><a class="btn" href="{{href}}">{{hrefLabel}}</a></p>{{/if}}{{/if}}
  </div>
</section>
