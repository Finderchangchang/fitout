<section class="section" data-section="rates" data-family="rates" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="rate-grid">
      {{#each items}}
      <article class="card rate-card">
        <h3 class="item-title">{{name}}</h3>
        <p class="rate-price">{{price}}</p>
        <p>{{text}}</p>
        <p><a class="btn" href="{{href}}">{{hrefLabel}}</a></p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
