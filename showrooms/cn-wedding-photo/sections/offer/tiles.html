<section class="section" data-section="offer" data-family="tiles" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="offer-grid" data-media-group="offer">
      {{#each items}}
      <article class="offer-card">
        <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
        <h3 class="item-title"><span class="offer-no">{{@index}}</span> {{name}}</h3>
        <p>{{text}}</p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
