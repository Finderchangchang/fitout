<section class="section" data-section="tasting" data-family="picker" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <style>
      {{#each items}}
      #{{anchor}} .taste:has(#taste-{{anchor}}-{{@index}}:checked) label[for="taste-{{anchor}}-{{@index}}"] {
        border-color: var(--primary);
      }
      {{/each}}
    </style>
    <div class="taste">
      {{#each items}}
      <input class="clip" type="radio" name="taste-{{anchor}}" id="taste-{{anchor}}-{{@index}}" {{#if on}}checked{{/if}}>
      <div class="taste-panel">
        <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}">
        <div class="taste-copy">
          <h3 class="item-title">{{name}}</h3>
          <p>{{text}}</p>
          <p class="price">{{price}}</p>
        </div>
      </div>
      {{/each}}
      <div class="taste-thumbs" data-media-group="tile">
        {{#each items}}
        <label for="taste-{{anchor}}-{{@index}}">
          <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
          <span>{{name}}</span>
        </label>
        {{/each}}
      </div>
      <p class="taste-more"><a class="btn" href="{{moreHref}}">{{moreLabel}}</a></p>
    </div>
  </div>
</section>
