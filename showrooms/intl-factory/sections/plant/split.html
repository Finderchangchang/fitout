<section class="section" data-section="plant" data-family="plants" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="plant-grid" data-media-group="card">
      {{#each items}}
      <article class="card plant-card">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3>{{name}}</h3>
        <p>{{text}}</p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
