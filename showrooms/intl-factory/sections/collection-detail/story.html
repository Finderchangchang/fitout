<section class="section" data-section="collection-detail" data-family="story" id="{{anchor}}">
  <div class="container">
    {{#if image}}
    <figure class="story-photo" data-media-group="scene">
      <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
    </figure>
    {{/if}}
    <div class="story-copy">
      {{#if isH1}}<h1 class="section-title">{{name}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{ui.details}}</h2>{{/if}}
      <p>{{summary}}</p>
      {{#if body}}<p class="prose">{{body}}</p>{{/if}}
      <p><a class="text-link" href="{{backHref}}">{{backLabel}}</a></p>
    </div>
    <aside class="quote-strip">
      <div>
        <p class="quote-title">Ask which parts fit this job</p>
        <p>Send the equipment drawing. The desk names the pieces and a date.</p>
      </div>
      <a class="btn btn-primary" href="{{primaryHref}}">{{primaryLabel}}</a>
    </aside>
  </div>
</section>
