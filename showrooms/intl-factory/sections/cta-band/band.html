<section class="section" data-section="cta-band" data-family="band" id="{{anchor}}">
  <div class="container cta-inner">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <p class="btn-row"><a class="btn btn-primary" href="{{primaryHref}}">{{primaryLabel}}</a></p>
  </div>
</section>
