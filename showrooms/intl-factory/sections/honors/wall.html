<section class="section" data-section="honors" data-family="wall" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="cert-grid" data-media-group="cert">
      {{#each items}}
      <article class="cert">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3>{{name}}</h3>
        {{#if issuer}}<p>{{issuer}}</p>{{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
