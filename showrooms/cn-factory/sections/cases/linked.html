<section class="section" data-section="cases" data-family="linked" id="{{anchor}}">
  <div class="container">
    <div class="section-head np-head">
      {{#if isH1}}<h1 class="section-title np-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="use-row" data-media-group="use">
      {{#each items}}
      <article class="use-card">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3>{{name}}</h3>
        <p class="media-card-summary">{{text}}</p>
        {{#if result}}<p class="media-card-meta">{{result}}</p>{{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
