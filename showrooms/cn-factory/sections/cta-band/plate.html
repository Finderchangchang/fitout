<section class="section np-quote" data-section="cta-band" data-family="plate" data-fullbleed id="{{anchor}}">
  <div class="np-quote-copy">
    <div class="np-quote-inner">
      {{#if isH1}}<h1 class="section-title np-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      <p class="np-quote-line"><a href="tel:{{phoneTel}}">{{phone}}</a></p>
      {{#if email}}<p class="np-quote-line"><a href="mailto:{{email}}">{{email}}</a></p>{{/if}}
      <p><a class="btn btn-primary" href="{{primaryHref}}">{{primaryLabel}}</a></p>
    </div>
  </div>
  {{#if image}}
  <figure class="np-quote-photo">
    <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
  </figure>
  {{/if}}
</section>
