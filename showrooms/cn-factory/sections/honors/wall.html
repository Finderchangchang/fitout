<section class="section" data-section="honors" data-family="wall" id="{{anchor}}">
  <div class="container">
    <div class="section-head np-head">
      {{#if isH1}}<h1 class="section-title np-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <ul class="seal-grid" data-media-group="seal">
      {{#each items}}
      <li>
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <h3>{{name}}</h3>
        {{#if issuer}}<p class="meta">{{issuer}}</p>{{/if}}
      </li>
      {{/each}}
    </ul>
  </div>
</section>
