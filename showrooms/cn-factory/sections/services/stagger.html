<section class="section" data-section="services" data-family="stagger" id="{{anchor}}">
  <div class="container">
    <div class="section-head np-head">
      {{#if isH1}}<h1 class="section-title np-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="stagger" data-media-group="process">
      {{#each items}}
      <article class="stagger-row">
        <div class="stagger-copy">
          <h3 class="item-title">{{name}}</h3>
          <p class="media-card-summary">{{text}}</p>
          {{#if tag}}<p class="media-card-meta"><span class="media-card-tag">{{tag}}</span></p>{{/if}}
          {{#if href}}<p><a class="text-link" href="{{href}}">看{{name}}</a></p>{{/if}}
        </div>
        {{#if image}}
        <figure class="stagger-photo">
          <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
        </figure>
        {{/if}}
      </article>
      {{/each}}
    </div>
  </div>
</section>
