<section class="section" data-section="why" data-family="cells" id="{{anchor}}">
  <div class="container">
    <div class="section-head np-head">
      {{#if isH1}}<h1 class="section-title np-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <ol class="cell-grid">
      {{#each items}}
      <li class="cell-plate">
        <h3>{{name}}</h3>
        <p>{{text}}</p>
      </li>
      {{/each}}
    </ol>
  </div>
</section>
