<section class="section np-splitband" data-section="why" data-family="overlay" data-fullbleed id="{{anchor}}">
  <div class="np-splitband-copy">
    <div class="np-splitband-inner">
      {{#if isH1}}<h1 class="section-title np-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
      <ol class="np-reasons">
        {{#each items}}
        <li>
          <h3>{{name}}</h3>
          <p>{{text}}</p>
        </li>
        {{/each}}
      </ol>
    </div>
  </div>
  {{#if image}}
  <figure class="np-splitband-photo">
    <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
  </figure>
  {{/if}}
</section>
