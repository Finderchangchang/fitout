<section class="section np-meter" data-section="trust" data-family="metrics" id="{{anchor}}">
  <div class="container">
    <div class="section-head np-head">
      {{#if isH1}}<h1 class="section-title np-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <dl class="meter-grid">
      {{#each items}}
      <div>
        <dd class="meter-value" data-count="{{countTo}}">{{value}}</dd>
        <dt>{{label}}</dt>
      </div>
      {{/each}}
    </dl>
  </div>
</section>
