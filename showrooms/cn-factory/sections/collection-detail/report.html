<section class="section" data-section="collection-detail" data-family="report" id="{{anchor}}">
  <div class="container report">
    <div class="report-copy">
      {{#if date}}<p class="meta nums">{{date}}</p>{{/if}}
      {{#if isH1}}<h1 class="section-title np-title">{{name}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title np-title">{{name}}</h2>{{/if}}
      <p>{{summary}}</p>
      {{#if body}}<p class="prose">{{body}}</p>{{/if}}
      <p class="btn-row">
        <a class="btn btn-primary" href="{{primaryHref}}">{{primaryLabel}}</a>
        <a class="text-link" href="{{backHref}}">{{backLabel}}</a>
      </p>
    </div>
    {{#if image}}
    <figure class="report-photo" data-media-group="story">
      <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
    </figure>
    {{/if}}
  </div>
</section>
