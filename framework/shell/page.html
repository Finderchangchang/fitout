<!DOCTYPE html>
<html lang="{{htmlLang}}" data-copied="{{ui.copied}}"{{#if flavor}} data-flavor="{{flavor}}"{{/if}}{{#if layout}} data-layout="{{layout}}"{{/if}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{pageDescription}}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ogLocale}}">
  {{#if canonical}}<link rel="canonical" href="{{canonical}}">{{/if}}
  <link rel="stylesheet" href="{{assetPrefix}}assets/site.css">
  {{#if jsonLd}}
  <script type="application/ld+json">{{@raw jsonLd}}</script>
  {{/if}}
  {{#if faqJsonLd}}
  <script type="application/ld+json">{{@raw faqJsonLd}}</script>
  {{/if}}
</head>
<body>
  {{#if demoBadge}}<p class="demo-badge">{{ui.demoBadge}}</p>{{/if}}
  <a class="skip" href="#main">{{ui.skip}}</a>
  {{@raw headerHtml}}
  <main id="main">
    {{@raw mainHtml}}
  </main>
  {{@raw footerHtml}}
  {{@raw floatHtml}}
  <script src="{{assetPrefix}}assets/site.js" defer></script>
</body>
</html>
