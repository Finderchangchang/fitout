<section class="section catalog-preview" data-section="collection-list" data-family="product-overview" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="catalog-preview-grid fit-rows" data-media-group="products">
      {{#each items}}
      <article class="catalog-preview-card">
        {{#if image}}<a href="{{href}}"><img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async"></a>{{/if}}
        <div class="catalog-preview-copy">
          {{#if category}}<p class="meta">{{category}}</p>{{/if}}
          <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
          <p class="media-card-summary">{{summary}}</p>
          {{#if price}}<p class="price">{{price}}</p>{{/if}}
        </div>
      </article>
      {{/each}}
    </div>
    {{#if moreHref}}<p class="catalog-preview-more"><a class="btn" href="{{moreHref}}">{{moreLabel}}</a></p>{{/if}}
  </div>
</section>
