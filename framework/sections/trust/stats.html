<!-- 结构见 spec.json 的 source。样式数值只走 token。 -->
<section class="section" data-section="trust" data-family="metrics" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <dl class="stat-grid">
      {{#each items}}
      <div class="card">
        <dt>{{label}}</dt>
        <dd class="stat-value" data-count="{{countTo}}">{{value}}</dd>
      </div>
      {{/each}}
    </dl>
  </div>
</section>
