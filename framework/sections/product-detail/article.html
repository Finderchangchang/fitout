<!-- 结构见 spec.json 的 source。样式数值只走 token。 -->
<section class="section" data-section="product-detail" data-family="article" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{name}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{name}}</h2>{{/if}}
      <p class="section-lead">{{summary}}</p>
      {{#if date}}<p class="meta">{{date}}</p>{{/if}}
    </div>
    {{#if image}}<img class="product-photo" src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
    <table class="specs">
      <tbody>
        {{#each specs}}
        <tr>
          <th>{{label}}</th>
          <td>{{value}}</td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    <div class="btn-row">
      <a class="btn btn-primary" href="{{primaryHref}}">{{primaryLabel}}</a>
      <a class="btn" href="index.html">{{icon:home:16}}{{ui.backProducts}}</a>
    </div>
  </div>
</section>
