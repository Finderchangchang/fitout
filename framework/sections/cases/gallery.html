<!-- 结构见 spec.json 的 source。样式数值只走 token。 -->
<section class="section" data-section="cases" data-family="gallery" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="gallery-grid" data-media-group="card">
      {{#each items}}
      <figure class="card">
        {{#if image}}<img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">{{/if}}
        <figcaption>
          <h3 class="item-title">{{name}}</h3>
          <p>{{text}}</p>
          {{#if result}}<p class="meta">{{result}}</p>{{/if}}
        </figcaption>
      </figure>
      {{/each}}
    </div>
  </div>
</section>
