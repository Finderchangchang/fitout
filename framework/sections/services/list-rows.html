<!-- 结构见 spec.json 的 source。样式数值只走 token。 -->
<section class="section" data-section="services" data-family="menu" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div>
      {{#each items}}
      <div class="menu-row">
        <div>
          <h3 class="item-title">{{name}}</h3>
          <p>{{text}}</p>
        </div>
        {{#if price}}<p class="price">{{price}}</p>{{/if}}
      </div>
      {{/each}}
    </div>
  </div>
</section>
