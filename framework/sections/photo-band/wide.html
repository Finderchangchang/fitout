<section class="photo-band" data-section="photo-band" data-family="bleed" data-fullbleed id="{{anchor}}">
  <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
  {{#if caption}}<p class="container meta">{{caption}}</p>{{/if}}
</section>
