<!-- 结构见 spec.json 的 source。样式数值只走 token。 -->
<section class="section" data-section="faq" data-family="columns" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="faq-columns">
      {{#each items}}
      <details>
        <summary>{{q}}<span class="chev">{{icon:chevron-down:20}}</span></summary>
        <p class="prose">{{a}}</p>
      </details>
      {{/each}}
    </div>
  </div>
</section>
