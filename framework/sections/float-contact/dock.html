<!-- 悬浮联系。调研没有可抄的开源区块。 -->
<div class="float-dock" data-float>
  <a class="btn" href="tel:{{phoneTel}}">{{icon:phone:20}}{{ui.call}}</a>
  {{#if hasWechat}}
  <details class="wechat-pop">
    <summary class="btn">{{icon:chat:20}}{{ui.addWechat}}</summary>
    <div class="wechat-panel">
      {{#if wechatQrSrc}}<img src="{{wechatQrSrc}}" alt="{{name}}{{ui.wechatQrAlt}}" width="{{wechatQrWidth}}" height="{{wechatQrHeight}}">{{/if}}
      {{#if wechat}}
      <p class="nums">{{wechat}}</p>
      <button type="button" class="btn" data-copy="{{wechat}}">{{ui.copyWechat}}</button>
      {{/if}}
    </div>
  </details>
  {{/if}}
  {{#if qrcodes}}
  <details class="wechat-pop qr-pop">
    <summary class="btn">{{ui.qrButton}}</summary>
    <div class="wechat-panel qr-pop-panel" data-qrcodes>
      {{#each qrcodes}}
      <figure class="footer-qr">
        <img src="{{src}}" alt="{{alt}}" width="{{width}}" height="{{height}}">
        {{#if label}}<figcaption>{{label}}</figcaption>{{/if}}
      </figure>
      {{/each}}
    </div>
  </details>
  {{/if}}
  <a class="btn" href="{{amapUrl}}">{{icon:map-pin:20}}{{ui.directions}}</a>
</div>
