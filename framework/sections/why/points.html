<!-- 结构见 spec.json 的 source。样式数值只走 token。 -->
<section class="section" data-section="why" data-family="points" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="grid-3">
      {{#each items}}
      <article class="card point-card">
        {{icon:check:20}}
        <h3 class="item-title">{{name}}</h3>
        <p>{{text}}</p>
      </article>
      {{/each}}
    </div>
  </div>
</section>
