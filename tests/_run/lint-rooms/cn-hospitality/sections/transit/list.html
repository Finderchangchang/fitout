<section class="section" data-section="transit" data-family="route" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <ul class="route-list">
      {{#each items}}
      <li>
        <h3 class="item-title">{{name}}</h3>
        <p>{{text}}</p>
      </li>
      {{/each}}
    </ul>
  </div>
</section>
