<section class="section" data-section="collection-list" data-family="register" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="room-grid" data-media-group="card">
      {{#each items}}
      <article class="card room-card">
        {{#if image}}<a href="{{href}}"><img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async"></a>{{/if}}
        <h3 class="item-title"><a href="{{href}}">{{name}}</a></h3>
        {{#if summary}}<p>{{summary}}</p>{{/if}}
        <div class="btn-row">
          <a class="btn btn-primary" href="tel:{{phoneTel}}">电话预订</a>
          <a class="text-link" href="{{href}}">看这间房</a>
        </div>
      </article>
      {{/each}}
    </div>
  </div>
</section>
