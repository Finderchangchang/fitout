<section class="section" data-section="album" data-family="wall" id="{{anchor}}">
  <div class="container">
    <div class="section-head">
      {{#if isH1}}<h1 class="section-title">{{title}}</h1>{{/if}}
      {{#if isH2}}<h2 class="section-title">{{title}}</h2>{{/if}}
      {{#if lead}}<p class="section-lead">{{lead}}</p>{{/if}}
    </div>
    <div class="wall" data-media-group="card">
      {{#each items}}
      <figure>
        <img src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async">
        <figcaption>{{caption}}</figcaption>
      </figure>
      {{/each}}
    </div>
  </div>
</section>
