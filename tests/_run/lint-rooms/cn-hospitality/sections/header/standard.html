<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{{homeHref}}">{{name}}</a>
    <nav class="desktop-nav" aria-label="主导航">
      <ul class="nav-list">
        {{#each nav}}<li><a href="{{href}}">{{label}}</a></li>{{/each}}
      </ul>
    </nav>
    <div class="header-tools">
      <a class="hotline" href="tel:{{phoneTel}}">
        <span class="hotline-label">订房热线</span>
        <span class="nums">{{phone}}</span>
      </a>
      <button type="button" class="btn menu-button" data-menu-button aria-expanded="false" aria-controls="mobile-menu">{{icon:menu:24}}<span class="sr">菜单</span></button>
    </div>
  </div>
  <div class="mobile-panel" id="mobile-menu" data-menu-panel hidden>
    <button type="button" class="btn" data-menu-button aria-expanded="false">{{icon:close:20}}<span class="sr">关闭</span></button>
    <nav aria-label="手机导航">
      {{#each nav}}<a href="{{href}}">{{label}}</a>{{/each}}
      <a href="tel:{{phoneTel}}">{{phone}}</a>
    </nav>
  </div>
  <script>
    (function () {
      var here = new URL(location.href);
      var links = document.querySelectorAll(".desktop-nav a, .mobile-panel nav a");
      for (var i = 0; i < links.length; i += 1) {
        var href = links[i].getAttribute("href") || "";
        if (!href || href.indexOf(":") !== -1) continue;
        var url = new URL(href, here);
        if (url.pathname === here.pathname) links[i].setAttribute("aria-current", "page");
      }
    })();
  </script>
</header>
